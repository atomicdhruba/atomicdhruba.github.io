<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg-glow)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="8"/>

  <!-- Atomic Orbital 1 (Horizontal) -->
  <ellipse cx="256" cy="256" rx="190" ry="65" fill="none" stroke="url(#purple-cyan)" stroke-width="14" filter="url(#glow)"/>

  <!-- Atomic Orbital 2 (Rotated 60deg) -->
  <g transform="rotate(60 256 256)">
    <ellipse cx="256" cy="256" rx="190" ry="65" fill="none" stroke="url(#cyan-purple)" stroke-width="14" filter="url(#glow)"/>
  </g>

  <!-- Atomic Orbital 3 (Rotated -60deg) -->
  <g transform="rotate(-60 256 256)">
    <ellipse cx="256" cy="256" rx="190" ry="65" fill="none" stroke="url(#purple-cyan)" stroke-width="14" filter="url(#glow)"/>
  </g>

  <!-- Nucleus glow -->
  <circle cx="256" cy="256" r="42" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="#f0f6fc"/>

  <!-- Electrons -->
  <circle cx="446" cy="256" r="14" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="161" cy="92" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="161" cy="420" r="14" fill="#a855f7" filter="url(#glow)"/>
</svg>
